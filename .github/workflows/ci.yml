name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The run for each commit to main is in a separate group. With one shared
  # group, a third push cancels the second run while it waits, and that
  # commit then gets no release and no failure. Pull request runs still
  # cancel older runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  examples:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # CI builds with the same compilers users install.
      - name: Install cc65
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/picocomputer/.github/main/install/cc65.sh | sh
          echo "$HOME/.rp6502/cc65/bin" >> "$GITHUB_PATH"

      - name: Install llvm-mos
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/picocomputer/.github/main/install/llvm-mos.sh | sh
          echo "$HOME/.rp6502/llvm-mos/bin" >> "$GITHUB_PATH"

      # The configure fetches the emulator, which git ignores, because
      # rp6502_map() runs a program on it.
      - name: Build every example
        run: |
          set -euo pipefail
          cmake --preset cc65/Release
          cmake --build --preset cc65/Release

      # Only the cc65 ROMs are released. This build checks that the examples
      # still compile with llvm-mos.
      - name: Build the examples with llvm-mos
        run: |
          set -euo pipefail
          cmake --preset llvm-mos/Release
          cmake --build --preset llvm-mos/Release

      - name: Collect the ROMs
        id: pack
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          # A release is named for the commit it ships. A pull request ships
          # nothing, and its HEAD is a merge commit nobody can look up, so it
          # is named for the run instead.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            name="rp6502-${sha}-examples"
          else
            name="rp6502-${GITHUB_RUN_ID}-examples"
          fi
          mkdir "$name"
          cp src/README.txt "$name/"
          # Only the target ROMs. CMakeFiles holds directories with the same
          # suffix, and the program that rp6502_map() runs while CMake
          # configures is also a .rp6502 file.
          find build/cc65/release/src -mindepth 2 -maxdepth 2 -type f \
               -name '*.rp6502' -exec cp -t "$name" {} +
          # One ROM per example, so a target that quietly stopped producing
          # one fails the release rather than leaving a gap in it.
          want=$(grep -c '^add_subdirectory(src/' CMakeLists.txt)
          got=$(find "$name" -name '*.rp6502' | wc -l)
          if [ "$got" -ne "$want" ]; then
            echo "packed ${got} ROMs for ${want} examples" >&2
            exit 1
          fi
          ls -l "$name"
          # Zipped from inside, so the ROMs are at the root of the archive
          # rather than one folder down.
          ( cd "$name" && cmake -E tar cf "../${name}.zip" --format=zip . )
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Only where nothing is released. The name ends in .zip because that is
      # the filename the download is served with, and the directory is what
      # goes in it, so the one archive holds the ROMs and nothing else.
      - uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main'
        with:
          name: ${{ steps.pack.outputs.name }}.zip
          path: ${{ steps.pack.outputs.name }}/

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ steps.pack.outputs.sha }}
          # Without this the tag is created on whatever the default branch
          # points at when the release is published, not on what was built.
          target_commitish: ${{ github.sha }}
          name: Examples ${{ steps.pack.outputs.sha }}
          files: ${{ steps.pack.outputs.name }}.zip
          fail_on_unmatched_files: true
          body: |
            Example ROMs for the Picocomputer 6502, built with cc65.

            Unzip and run a `.rp6502` in the emulator, or load one on a
            Picocomputer.

            https://picocomputer.github.io
